<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Bot Panel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🤖 Bot Panel</h1>
                <p>Reset password Anda via Telegram</p>
            </div>
            
            <!-- Step 1: Input Telegram ID -->
            <div id="step1">
                <form id="forgotForm">
                    <div class="form-group">
                        <label for="telegram_id">Telegram ID</label>
                        <input type="text" id="telegram_id" name="telegram_id" required placeholder="Contoh: 123456789" pattern="\d{6,15}" title="Telegram ID harus angka 6-15 digit">
                        <small>Masukkan Telegram ID yang terdaftar</small>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Kirim Kode Reset</button>
                </form>
            </div>

            <!-- Step 2: Verifikasi Kode -->
            <div id="step2" style="display: none;">
                <form id="verifyCodeForm">
                    <div class="form-group">
                        <label for="reset_code">Kode Verifikasi (6 digit)</label>
                        <input type="text" id="reset_code" name="code" required placeholder="123456" pattern="\d{6}" maxlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Verifikasi Kode</button>
                </form>
            </div>

            <!-- Step 3: Reset Password -->
            <div id="step3" style="display: none;">
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="new_password">Password Baru</label>
                        <input type="password" id="new_password" name="new_password" required placeholder="Minimal 6 karakter" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Konfirmasi Password Baru</label>
                        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Ulangi password baru">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Ubah Password</button>
                </form>
            </div>

            <div class="auth-footer">
                <p><a href="/index.html">Kembali ke login</a></p>
            </div>
            <div id="message" class="message"></div>
        </div>
    </div>
    <script src="/js/forgot-password.js"></script>
</body>
</html>
