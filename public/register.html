<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Bot Panel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🤖 Bot Panel</h1>
                <p>Buat akun baru</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="username">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="nama@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Minimal 6 karakter" minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Ulangi password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Daftar</button>
            </form>
            <div class="auth-footer">
                <p>Sudah punya akun? <a href="/index.html">Masuk disini</a></p>
            </div>
            <div id="message" class="message"></div>
        </div>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
